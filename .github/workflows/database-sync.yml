name: Canonical Database Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/sync
        run: uv sync
      - name: Refresh canonical database
        working-directory: services/sync
        run: uv run tokenpricing-sync sync
      - name: Prune old history snapshots
        run: |
          mapfile -t history_files < <(ls -1t database/history/prices-*.json 2>/dev/null || true)
          if [ "${#history_files[@]}" -gt 42 ]; then
            printf '%s\0' "${history_files[@]:42}" | xargs -0 rm -f --
          fi
      - name: Commit refreshed data
        run: |
          if git diff --quiet; then
            echo "No database changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/current database/history database/changelog
          git commit -m "chore: refresh canonical pricing database"
          git push
