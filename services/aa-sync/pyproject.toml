[project]
name = "tokenpricing-aa-sync"
version = "0.1.0"
description = "Artificial Analysis acquisition workload for tokenpricing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.2",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "tokenpricing",
]

[project.scripts]
tokenpricing-aa-sync = "tokenpricing_aa.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
tokenpricing = { path = "../../libraries/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
