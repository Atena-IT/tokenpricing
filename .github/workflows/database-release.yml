name: Publish Database Release

# Builds the derived SQLite database (prices.db) from the committed canonical
# JSON and publishes it to the rolling `database-latest` GitHub Release, which
# gives consumers a stable download URL:
#   https://github.com/Atena-IT/tokenpricing/releases/download/database-latest/prices.db
#
# Triggers:
#   - workflow_dispatch: manual, on-demand publish
#   - push of a `database-release-*` tag: lets the release be (re)published from
#     any ref, including before this workflow lands on the default branch
on:
  workflow_dispatch:
  push:
    tags:
      - "database-release-*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/sync
        run: uv sync
      - name: Build prices.db from committed canonical JSON
        working-directory: services/sync
        run: uv run tokenpricing-sync build-db
      - name: Publish prices.db to the rolling database-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: database-latest
          name: Canonical pricing database (latest)
          body: |
            Auto-published derived SQLite build of the canonical pricing database
            (`database/current/prices.db`), schema v1 (`PRAGMA user_version = 1`).

            This is a **rolling** release: the `prices.db` asset is replaced on
            every database sync, so the download URL is stable. It is a data
            artifact, not a software release.
          files: database/current/prices.db
          make_latest: false
          prerelease: false
