name: Canonical Database Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "13 */6 * * *"

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          version: latest
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        working-directory: services/sync
        run: uv sync
      - name: Refresh canonical database
        working-directory: services/sync
        run: uv run tokenpricing-sync sync
      - name: Prune old history snapshots
        run: |
          mapfile -t history_files < <(ls -1t database/history/prices-*.json 2>/dev/null || true)
          if [ "${#history_files[@]}" -gt 42 ]; then
            printf '%s\0' "${history_files[@]:42}" | xargs -0 rm -f --
          fi
      - name: Build prices.db
        working-directory: services/sync
        run: uv run tokenpricing-sync build-db
      - name: Commit refreshed data
        # Only scheduled runs persist refreshed data to git. Manual dispatches
        # refresh the release/artifact for testing without mutating the branch.
        if: github.event_name == 'schedule'
        run: |
          if git diff --quiet; then
            echo "No database changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add database/current database/history database/changelog
          git commit -m "chore: refresh canonical pricing database"
          git push
      - name: Upload prices.db as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: prices-db
          path: database/current/prices.db
          if-no-files-found: error
          retention-days: 7
      - name: Publish prices.db to the rolling database-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: database-latest
          name: Canonical pricing database (latest)
          body: |
            Auto-published derived SQLite build of the canonical pricing database
            (`database/current/prices.db`), schema v1 (`PRAGMA user_version = 1`).

            This is a **rolling** release: the `prices.db` asset is replaced on
            every database sync, so the download URL is stable. It is a data
            artifact, not a software release.
          files: database/current/prices.db
          make_latest: false
          prerelease: false
